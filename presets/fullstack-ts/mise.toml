# Toolchain + task entrypoints. First run: mise trust && mise install && mise run install.
[tools]
node = "26"
pnpm = "12"

[tasks.install]
description = "pnpm install"
run = "pnpm install"

[tasks.dev]
description = "concurrent vite + tsx watch on server"
run = "pnpm run dev"

[tasks.typecheck]
description = "tsc --noEmit across client/server/shared"
run = "pnpm run typecheck"

[tasks.lint]
description = "Biome or ESLint"
run = "pnpm run lint"

[tasks.build]
description = "build client (dist/client) and server (dist/server)"
run = "pnpm run build"

[tasks.start]
description = "node dist/server/index.js (serves API + static client)"
run = "pnpm run start"

[tasks.test]
description = "Vitest"
run = "pnpm run test"

[tasks."db:generate"]
description = "drizzle-kit generate (if using Drizzle)"
run = "pnpm run db:generate"

[tasks."db:migrate"]
description = "apply migrations"
run = "pnpm run db:migrate"

[tasks.check]
description = "typecheck + lint + test"
depends = ["typecheck", "lint", "test"]
