# Toolchain + task entrypoints. First run: mise trust && mise install && mise run install.
[tools]
node = "26"
pnpm = "12"

[tasks.install]
description = "pnpm install"
run = "pnpm install"

[tasks.dev]
description = "tsx watch on src/index.ts (or equivalent)"
run = "pnpm run dev"

[tasks.typecheck]
description = "tsc --noEmit"
run = "pnpm run typecheck"

[tasks.lint]
description = "Biome or ESLint"
run = "pnpm run lint"

[tasks.build]
description = "tsc to dist/"
run = "pnpm run build"

[tasks.start]
description = "node dist/index.js"
run = "pnpm run start"

[tasks.test]
description = "Vitest (fast suite)"
run = "pnpm run test"

[tasks."openapi:export"]
description = "TODO: emit openapi.json from Zod schemas"
run = "pnpm run openapi:export"

[tasks.check]
description = "typecheck + lint + test"
depends = ["typecheck", "lint", "test"]
