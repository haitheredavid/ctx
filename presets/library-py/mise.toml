# Toolchain + task entrypoints. First run: mise trust && mise install && mise run install.
[tools]
python = "3.14"
uv = "0.13"

[tasks.install]
description = "install/update from uv.lock"
run = "uv sync"

[tasks.test]
description = "tests"
run = "uv run pytest"

[tasks.lint]
description = "lint"
run = "uv run ruff check ."

[tasks.format]
description = "format"
run = "uv run ruff format ."

[tasks.typecheck]
description = "static type check"
run = "uv run ty check"

[tasks.build]
description = "build sdist + wheel into dist/"
run = "uv build"

[tasks.publish]
description = "publish dist/* (or: uv run twine upload dist/*)"
run = "uv publish"

[tasks.check]
description = "lint + typecheck + test"
depends = ["lint", "typecheck", "test"]
